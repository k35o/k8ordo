name: 'Chromatic'

on:
  push:
    branches:
      - main
  pull_request:

# push 契機を main に絞った以上、PR の古い実行を残す理由もない。
concurrency:
  group: chromatic-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  chromatic-deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Storybook は packages/ui の src から組むが、ui が読む @k8ordo/i18n は
      # その dist から解決されるので、build: none にはできない。
      - name: Install
        uses: ./.github/composite-actions/install
      - name: Publish to Chromatic
        uses: chromaui/action@a18e9f57b71eb05f941848c0b927aab2ee644e3e # v18.10.2
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          onlyChanged: true
          skip: 'renovate/**'
          workingDir: packages/ui
