name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

# Git and API writes go through the App token; GITHUB_TOKEN only needs the
# id-token for npm OIDC trusted publishing.
permissions:
  contents: read
  id-token: write

jobs:
  # PR で通った検査も、並んでマージされた PR の組み合わせで壊れうる。公開する
  # コミットそのものに同じ検査を通し、落ちたらリリース PR の更新も公開もしない。
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Generate token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.K35O_BOT_CLIENT_ID }}
          private-key: ${{ secrets.K35O_BOT_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      # ビルドは publish 直前に release action の build 入力が回す。ここで
      # 先に組んでも捨てられるだけなので install だけにする。
      - name: Install
        uses: ./.github/composite-actions/install
        with:
          build: none

      - name: Release
        uses: k35o/pnpm-release-action@5e009384bf5b1d2501f8405817b5d5578a90624e # v0.2.2
        with:
          build: pnpm build
          github-token: ${{ steps.app-token.outputs.token }}
