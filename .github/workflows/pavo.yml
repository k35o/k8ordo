name: Pavo

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review_comment:
    types: [created]
  issue_comment:
    types: [created]

# 呼び先の review.yml は job 側で contents:read しか要求せず、GitHub への
# 書き込みは App トークンで行う。既定スコープを継がせる理由はない。
permissions:
  contents: read

jobs:
  pavo:
    if: ${{ github.event_name != 'issue_comment' || startsWith(github.event.comment.body, '/pavo') }}
    uses: k35o/pavo/.github/workflows/review.yml@6fc74320f5486215e27260e05ff148ba5b708f0b # main
    with:
      instructions: default,react,typescript
      extra_prompt: |
        @k8ordo/* の React ライブラリ群のモノレポ。ui（コンポーネント、Storybook + Chromatic VRT）、
        form、state、router、i18n（ロケール軸）、color-scheme（配色の好み、state の上）、
        static / server（RSC フレームワーク。framework-engine は両モードに同梱される
        非公開の共通部）、apps/docs（サイト、@k8ordo/static で構築）。
        前提: React 19 + RSC、Baseline newly available のみ、ポリフィルなし。
    secrets: inherit
