name: CI

# main への push では release.yml がこのワークフローを呼び、通ってから
# リリース PR の更新か公開に進む。push で別に起動すると同じ検査が 2 回走る。
on:
  pull_request:
    branches:
      - main
  workflow_call:

# 後続の push が来たら古い実行は用済み。走らせ切っても誰も読まない。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ブラウザのテストはエンジンごとにジョブを分けて並べる。1 ジョブで 3 つ
  # 回すと待ち時間が 3 倍になる。1 つが落ちても他のエンジンの結果は見たい。
  tests:
    name: Tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      TEST_BROWSER: ${{ matrix.browser }}
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install
        uses: ./.github/composite-actions/install

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ matrix.browser }}-${{ hashFiles('pnpm-lock.yaml') }}

      # キャッシュに入るのはブラウザ本体だけで、OS のライブラリは毎回入れる。
      # Firefox と WebKit にはランナーに無いライブラリが要る。
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}

      # 最初の失敗で打ち切ると、走っていた他のパッケージも止まり、そのエンジンで
      # どこが落ちるのかが 1 つずつしか見えない。全部回してから落とす。
      - name: Run tests
        run: pnpm --filter './packages/*' --no-bail test

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install
        uses: ./.github/composite-actions/install

      # docs のビルドは llms.txt を書き直すので、比べるのはその前でないと
      # いつも一致してしまう。
      - name: Check llms.txt is in sync with the packages' indexes
        run: pnpm --filter docs check:llms

      # 型を使う lint も typecheck と同じ .k8ordo/ を読む。表が無いと
      # PageProps の params が文字列に落ち、String(params.id) を余計な変換と
      # 誤読する。TypeScript ジョブと同じ手順で先に生成する。
      - name: Generate the route tables of the framework applications
        run: pnpm --filter docs --filter example-static-basic --filter example-server-basic build

      - name: Run lint and format check
        run: pnpm check

      # 血縁のうち機械的に守れる一点。Baseline 入りだけを前提にする以上、
      # ポリフィルを依存に足した時点で規律が破れている。
      - name: Check no polyfills are pulled in
        run: pnpm check:no-polyfills

      # peer の範囲を満たしたまま 2 コピーに割れると、アダプタが読む React
      # context が別物になり、型もビルドもテストも通ったまま描画時だけ落ちる。
      - name: Check shared peers resolve to a single copy
        run: pnpm check:peer-copies

  types:
    name: TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install
        uses: ./.github/composite-actions/install

      # route ファイルの型は生成される .k8ordo/ から来る (server-basic の
      # PageProps は Register の request を読む)。docs も同じ表で SitePath を
      # 検査するので、フレームワークの上に載っているものは先にビルドする。
      - name: Generate the route tables of the framework applications
        run: pnpm --filter docs --filter example-static-basic --filter example-server-basic build

      - name: Run typecheck
        run: pnpm typecheck

  package:
    name: Package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # composite install が packages をビルド済み。
      - name: Install
        uses: ./.github/composite-actions/install

      # Validate the publishable artifact: publint checks packaging metadata,
      # attw checks that types resolve under every module-resolution mode.
      - name: Check packaging
        run: pnpm --filter './packages/*' check:package

  # パッケージの下流（サイトと examples）は composite install の build から
  # 外してある。Lint と TypeScript も route 表のために組むが、書き出した
  # 全ルートを確かめるのは docs、examples の出力を確かめるのは examples だけ。
  docs:
    name: Docs site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install
        uses: ./.github/composite-actions/install

      - name: Build docs site
        run: pnpm --filter './apps/*' build

  # ui-integrations はブラウザモードのテストを、static-basic と server-basic は
  # 組み上げたアプリをブラウザで開くテストを持つ。tests と同じくエンジンごとに分ける。
  examples:
    name: Examples (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      TEST_BROWSER: ${{ matrix.browser }}
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install
        uses: ./.github/composite-actions/install

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ matrix.browser }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}

      # ビルドが通るだけでは「生成 UI のデモが実は何も描画しない」
      # 「フレームワークが 1 枚も書き出していない」を検出できないため、
      # デモの spec / DSL を実パーサに通し、フレームワークの出力とハンドラを
      # 主張する test も併せて回す。
      - name: Build examples
        run: pnpm build:examples

      - name: Verify examples
        run: pnpm test:examples

  tokens:
    name: Tokens
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # どちらのチェックも packages/ui の src と docs しか読まないので dist は要らない。
      - name: Install
        uses: ./.github/composite-actions/install
        with:
          build: none

      # Re-extract tokens from index.css and fail if the committed
      # tokens.generated.ts is stale (CSS edit, Tailwind bump, or tool update).
      # Fix with: pnpm --filter @k8ordo/ui generate:tokens
      - name: Check design tokens are in sync with CSS
        run: pnpm --filter @k8ordo/ui check:tokens

      # Re-extract component props from the types and fail if the committed
      # props.generated.json is stale (a prop added, renamed, or retyped).
      # Fix with: pnpm --filter @k8ordo/ui generate:props
      - name: Check component props are in sync with types
        run: pnpm --filter @k8ordo/ui check:props
