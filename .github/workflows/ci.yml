name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install
        uses: ./.github/composite-actions/install

      - name: Install Playwright browsers
        run: pnpm exec playwright install

      - name: Run tests
        run: pnpm --filter './packages/*' test

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install
        uses: ./.github/composite-actions/install

      - name: Run lint and format check
        run: pnpm check

      # 血縁のうち機械的に守れる一点。Baseline 入りだけを前提にする以上、
      # ポリフィルを依存に足した時点で規律が破れている。
      - name: Check no polyfills are pulled in
        run: pnpm check:no-polyfills

  types:
    name: TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install
        uses: ./.github/composite-actions/install

      - name: Run typecheck
        run: pnpm typecheck

  package:
    name: Package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install
        uses: ./.github/composite-actions/install

      - name: Build package
        run: pnpm --filter './packages/*' build

      # Validate the publishable artifact: publint checks packaging metadata,
      # attw checks that types resolve under every module-resolution mode.
      - name: Check packaging
        run: pnpm --filter './packages/*' check:package

  examples:
    name: Examples
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install
        uses: ./.github/composite-actions/install

      # examples は他ジョブが必要としないので composite install の build からは
      # 外したまま、このジョブだけで面倒を見る。ビルドが通るだけでは
      # 「生成 UI のデモが実は何も描画しない」を検出できないため、デモの
      # spec / DSL を実パーサに通す test も併せて回す。
      - name: Build examples
        run: pnpm build:examples

      - name: Verify generative UI demos are renderable
        run: pnpm test:examples

  tokens:
    name: Tokens
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install
        uses: ./.github/composite-actions/install

      # Re-extract tokens from index.css and fail if the committed
      # tokens.generated.ts is stale (CSS edit, Tailwind bump, or tool update).
      # Fix with: pnpm --filter @k8ordo/ui generate:tokens
      - name: Check design tokens are in sync with CSS
        run: pnpm --filter @k8ordo/ui check:tokens

      # Re-extract component props from the types and fail if the committed
      # props.generated.json is stale (a prop added, renamed, or retyped).
      # Fix with: pnpm --filter @k8ordo/ui generate:props
      - name: Check component props are in sync with types
        run: pnpm --filter @k8ordo/ui check:props
