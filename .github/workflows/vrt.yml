name: VRT

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: vrt-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  vrt:
    name: VRT
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install
        uses: ./.github/composite-actions/install

      - name: Install Playwright browsers
        # --with-deps installs the OS font packages (incl. CJK: fonts-ipafont-gothic /
        # fonts-wqy-zenhei) so Japanese text renders instead of tofu (□) boxes.
        run: pnpm exec playwright install --with-deps chromium

      - name: Capture story screenshots
        run: pnpm --filter @k8ordo/ui test:vrt

      # main: 撮影結果を次回のPR比較用ベースラインとして保存する
      - name: Upload baseline
        if: github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vrt-baseline
          path: packages/ui/.vrt/actual
          retention-days: 30

      # PR: mainの最新ベースラインを取得する（無ければ比較をスキップ）
      - name: Download baseline from main
        if: github.event_name == 'pull_request'
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          run_id=$(gh api "repos/$REPO/actions/workflows/vrt.yml/runs?branch=main&status=success&per_page=1" --jq '.workflow_runs[0].id // empty')
          if [ -n "$run_id" ] && gh run download "$run_id" --name vrt-baseline --dir packages/ui/.vrt/expected --repo "$REPO"; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compare against baseline
        if: github.event_name == 'pull_request' && steps.baseline.outputs.found == 'true'
        id: compare
        continue-on-error: true
        working-directory: packages/ui
        run: pnpm exec svrt compare

      - name: Upload report
        if: github.event_name == 'pull_request' && steps.baseline.outputs.found == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vrt-report
          path: packages/ui/.vrt
          retention-days: 14

      - name: Publish report to Cloudflare Pages
        if: github.event_name == 'pull_request' && steps.baseline.outputs.found == 'true'
        id: pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 31074c2d041f3ceb8a5bb3fc51dd3bfa
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # トークン未登録の間はスキップし、artifactのみのフォールバックになる
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo 'CLOUDFLARE_API_TOKEN が未登録のためPagesへの公開をスキップ'
            exit 0
          fi
          pnpm exec wrangler pages project create k8ordo-vrt --production-branch=main 2>/dev/null || true
          pnpm exec wrangler pages deploy packages/ui/.vrt --project-name=k8ordo-vrt --branch="pr-$PR_NUMBER" --commit-dirty=true
          # svrt comment は base URL に report.html と画像パスを自分で連結する
          echo "url=https://pr-$PR_NUMBER.k8ordo-vrt.pages.dev" >> "$GITHUB_OUTPUT"

      # sticky コメントの upsert は svrt comment 本体がやる（marker 検索 → PATCH/POST、
      # 差分ゼロかつ既存コメント無しなら投稿しない）。Pages 未公開時は縮退サマリになる。
      - name: Comment summary on PR
        if: github.event_name == 'pull_request' && steps.baseline.outputs.found == 'true'
        working-directory: packages/ui
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPORT_URL: ${{ steps.pages.outputs.url }}
        run: |
          args=()
          if [ -n "$REPORT_URL" ]; then args+=(--report-url "$REPORT_URL"); fi
          pnpm exec svrt comment "${args[@]}"

      # 差分があっても CI は落とさず、warning 注釈で可視化するだけにする。
      # 意図した変更かの判断は人間が PR コメント（sticky）と report を見て行う。
      - name: Warn when differences exist
        if: github.event_name == 'pull_request' && steps.compare.outcome == 'failure'
        run: |
          echo '::warning::視覚的な差分があります。PRコメントとvrt-report artifactを確認してください。'
