name: VRT

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: vrt-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  vrt:
    name: VRT
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-resolute
      options: --user 1001 --ipc=host
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Storybook は packages/ui の src から組むが、ui が読む @k8ordo/i18n は
      # その dist から解決されるので、build: none にはできない。
      - name: Install
        uses: ./.github/composite-actions/install

      # headless shell の総称 monospace は、はじめ fontconfig の monospace
      # （WenQuanYi Zen Hei Mono）を指すが、画面より背の高いストーリーを撮ると
      # （captureBeyondViewport）ブラウザ側の既定の Courier New（Liberation
      # Mono）に書き戻され、Liberation Mono に無い字の字形が撮る順で変わる。
      # Courier New も同じ書体に解決させて書き戻しの前後をそろえる。
      - name: Resolve Courier New to the default monospace font
        run: |
          mkdir -p ~/.config/fontconfig
          cat > ~/.config/fontconfig/fonts.conf <<'EOF'
          <?xml version="1.0"?>
          <!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
          <fontconfig>
            <alias binding="strong">
              <family>Courier New</family>
              <prefer><family>WenQuanYi Zen Hei Mono</family></prefer>
            </alias>
          </fontconfig>
          EOF
          test "$(fc-match -f '%{family[0]}' 'Courier New')" = "$(fc-match -f '%{family[0]}' monospace)"

      - name: Capture story screenshots
        run: pnpm --filter @k8ordo/ui test:vrt

      # main: 撮影結果を次回のPR比較用ベースラインとして保存する
      - name: Upload baseline
        if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vrt-baseline
          path: packages/ui/.vrt/actual
          retention-days: 30

      # PR: mainの最新ベースラインを取得する（無ければ比較をスキップ）
      - name: Find baseline from main
        if: github.event_name == 'pull_request'
        id: baseline
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: 'vrt.yml',
              branch: 'main',
              status: 'success',
              per_page: 1,
            });
            const run = data.workflow_runs[0];
            if (run === undefined) return;
            const {
              data: { artifacts },
            } = await github.rest.actions.listWorkflowRunArtifacts({
              owner,
              repo,
              run_id: run.id,
              name: 'vrt-baseline',
            });
            if (artifacts.some((artifact) => !artifact.expired)) {
              core.setOutput('found', 'true');
              core.setOutput('run-id', String(run.id));
            }

      - name: Download baseline from main
        if: steps.baseline.outputs.found == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vrt-baseline
          path: packages/ui/.vrt/expected
          run-id: ${{ steps.baseline.outputs.run-id }}
          github-token: ${{ github.token }}

      - name: Compare against baseline
        if: github.event_name == 'pull_request' && steps.baseline.outputs.found == 'true'
        id: compare
        continue-on-error: true
        working-directory: packages/ui
        run: pnpm exec svrt compare

      - name: Upload report
        if: github.event_name == 'pull_request' && steps.baseline.outputs.found == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vrt-report
          path: packages/ui/.vrt
          retention-days: 14

      - name: Publish report to Cloudflare Pages
        if: github.event_name == 'pull_request' && steps.baseline.outputs.found == 'true'
        id: pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 31074c2d041f3ceb8a5bb3fc51dd3bfa
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # トークン未登録の間はスキップし、artifactのみのフォールバックになる
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo 'CLOUDFLARE_API_TOKEN が未登録のためPagesへの公開をスキップ'
            exit 0
          fi
          pnpm exec wrangler pages project create k8ordo-vrt --production-branch=main 2>/dev/null || true
          pnpm exec wrangler pages deploy packages/ui/.vrt --project-name=k8ordo-vrt --branch="pr-$PR_NUMBER" --commit-dirty=true
          # svrt comment は base URL に report.html と画像パスを自分で連結する
          echo "url=https://pr-$PR_NUMBER.k8ordo-vrt.pages.dev" >> "$GITHUB_OUTPUT"

      # sticky コメントの upsert は svrt comment 本体がやる（marker 検索 → PATCH/POST、
      # 差分ゼロかつ既存コメント無しなら投稿しない）。Pages 未公開時は縮退サマリになる。
      - name: Comment summary on PR
        if: github.event_name == 'pull_request' && steps.baseline.outputs.found == 'true'
        working-directory: packages/ui
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPORT_URL: ${{ steps.pages.outputs.url }}
        run: |
          args=()
          if [ -n "$REPORT_URL" ]; then args+=(--report-url "$REPORT_URL"); fi
          pnpm exec svrt comment "${args[@]}"

      # 差分があっても CI は落とさず、warning 注釈で可視化するだけにする。
      # 意図した変更かの判断は人間が PR コメント（sticky）と report を見て行う。
      - name: Warn when differences exist
        if: github.event_name == 'pull_request' && steps.compare.outcome == 'failure'
        run: |
          echo '::warning::視覚的な差分があります。PRコメントとvrt-report artifactを確認してください。'
