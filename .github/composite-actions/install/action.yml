name: Install
description: Sets up mise, installs dependencies, and builds what the job needs

inputs:
  build:
    description: |
      packages (default): build every publishable package. Anything that
      resolves `@k8ordo/*` by name — package tests, type-aware lint, typecheck,
      examples — reads it out of that package's dist, so those jobs need this.
      none: install only. For jobs that stay inside one package's src.
    default: packages

runs:
  using: composite
  steps:
    - name: Setup mise
      uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
      with:
        cache: true

    - name: Install dependencies
      shell: bash
      run: pnpm ci

    # apps/docs is deliberately absent: most jobs never read the site, so they
    # do not pay for prerendering every route. The ones that read its output
    # or its generated route table build it themselves.
    - name: Build
      shell: bash
      env:
        BUILD: ${{ inputs.build }}
      run: |
        case "$BUILD" in
          packages) pnpm --filter './packages/*' build ;;
          none) echo 'build: none — install only' ;;
          *) echo "::error::install: build must be packages or none (got: $BUILD)" && exit 1 ;;
        esac
