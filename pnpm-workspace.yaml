packages:
  - packages/*
  - apps/*
  - examples/*

allowBuilds:
  '@openuidev/lang-core': false
  '@tailwindcss/oxide': false
  esbuild: false
  sharp: false
  # wranglerの依存。pages deployはAPIアップロードのみでworkerd実行は不要
  workerd: false

blockExoticSubdeps: true

catalog:
  '@arethetypeswrong/cli': 0.18.5
  # generative-UI アダプタの peer。@k8ordo/ui が開発対象にする版と examples が
  # 使う版を同じ 1 コピーに保つ (scripts/check-peer-copies.mjs が検査する)。
  '@json-render/core': 0.20.0
  '@json-render/react': 0.20.0
  '@openuidev/lang-core': 0.3.0
  '@openuidev/react-lang': 0.3.0
  '@tailwindcss/postcss': 4.3.3
  '@tailwindcss/vite': 4.3.3
  '@types/node': 24.13.5
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  '@vitejs/plugin-react': 6.1.1
  '@vitest/browser': 5.0.1
  '@vitest/browser-playwright': 5.0.1
  '@vitest/browser-preview': 5.0.1
  '@vitest/coverage-v8': 5.0.1
  '@vitest/expect': 5.0.1
  '@vitest/mocker': 5.0.1
  '@vitest/pretty-format': 5.0.1
  '@vitest/snapshot': 5.0.1
  '@vitest/spy': 5.0.1
  '@vitest/ui': 5.0.1
  '@vitest/utils': 5.0.1
  # @k8ordo/ui/ai-sdk の peer。example が使う @ai-sdk/react は ai を exact で
  # 持つので、上げるときは同じ ai を持つ @ai-sdk/react と揃えて 1 コピーに保つ。
  ai: 7.0.105
  playwright: 1.63.0
  postcss: 8.5.28
  publint: 0.3.24
  react: 19.3.0
  react-dom: 19.3.0
  server-only: 0.0.1
  tailwindcss: 4.3.3
  typescript: 7.0.2
  # vite-plus 0.3.1 以降の `vp pack` / `vp dev` は、実行するパッケージが vite を
  # 宣言していると、それが同じ版の @voidzero-dev/vite-plus-core でなければ落ちる。
  # 本家 vite ではなく core の別名を置き、版は vite-plus と常に揃える。
  # 宣言を消して vite-plus 任せにしないのは、消すと plugin-react や vitest の
  # peer に pnpm が本家 vite を自動で入れ、vitest の実体が割れて
  # expect.element の型が消えるため。
  vite: npm:@voidzero-dev/vite-plus-core@0.3.2
  vite-plus: 0.3.2
  vitest: 5.0.1
  vitest-browser-react: 2.3.0
  zod: 4.6.5

minimumReleaseAge: 10080

# vite (rolldown 経由) と vite-plus はそれぞれ @oxc-project/types を exact pin しており、
# 両者の pin がずれると同一内容の型が 2 コピーになり、vite の Plugin 型の比較で
# tsc が "Excessive stack depth" を起こして typecheck が落ちる。単一バージョンに
# 強制して型グラフのコピーを 1 つに保つ (types のみのパッケージでランタイム影響なし)。
overrides:
  '@oxc-project/types': 0.150.0

  # vitest は vite-plus が exact pin (0.3.2 時点でも 4.1.11) で連れてくる依存で、
  # `vp test` が起動するのは常に vite-plus 側の 1 本。catalog だけを 5 に上げても
  # 走るのは 4 のままで、そこへ @vitest/browser-playwright 5 が刺さり、
  # ブラウザモードが `_parentBrowser.spawn is not a function` で落ちる。
  # 木全体を catalog の 1 バージョンに寄せて、vitest のコピーを 1 つに保つ。
  # 版は書かず catalog を指す。overrides に数字を置くと catalog だけが更新された
  # ときに overrides が黙って巻き戻す pin になり、上げたつもりで上がらない。
  # vite-plus が vitest 5 を同梱したら、このブロックごと消して catalog だけで
  # 足りる状態に戻すこと。
  # @vitest/runner は v5 で vitest 本体に取り込まれ公開が止まったので 5 系が無い。
  # vite-plus は再エクスポートのため (dist/test/plugins/runner.js、32 バイト) に
  # 参照しているだけで実行時には読まれないため、4.1.11 のまま残す。
  vitest: 'catalog:'
  '@vitest/browser': 'catalog:'
  '@vitest/browser-playwright': 'catalog:'
  '@vitest/browser-preview': 'catalog:'
  '@vitest/coverage-v8': 'catalog:'
  '@vitest/expect': 'catalog:'
  '@vitest/mocker': 'catalog:'
  '@vitest/pretty-format': 'catalog:'
  '@vitest/snapshot': 'catalog:'
  '@vitest/spy': 'catalog:'
  '@vitest/ui': 'catalog:'
  '@vitest/utils': 'catalog:'

minimumReleaseAgeExclude:
  - '@k8o/*'
  - 'storybook-addon-determinism'
  - 'storybook-addon-vrt'
  - 'tailwind-token-extractor'
  - 'vite-plus-inspector'

verifyDepsBeforeRun: install

versioning:
  changelog:
    storage: repository
