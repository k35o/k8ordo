packages:
  - packages/*
  - apps/*
  - examples/*

allowBuilds:
  '@openuidev/lang-core': false
  '@tailwindcss/oxide': false
  esbuild: false
  sharp: false
  # wranglerの依存。pages deployはAPIアップロードのみでworkerd実行は不要
  workerd: false

blockExoticSubdeps: true

catalog:
  '@arethetypeswrong/cli': 0.18.5
  # ui と docs の CSS Modules の型生成と検査 (better-css-modules check)。
  # 3 つは同じ版で出るので、上げるときは揃える。
  '@better-css-modules/cli': 0.4.1
  '@better-css-modules/core': 0.4.1
  '@better-css-modules/vite': 0.4.1
  # generative-UI アダプタの peer。@k8ordo/ui が開発対象にする版と examples が
  # 使う版を同じ 1 コピーに保つ (scripts/check-peer-copies.mjs が検査する)。
  '@json-render/core': 0.21.1
  '@json-render/react': 0.21.1
  '@openuidev/lang-core': 1.0.1
  '@openuidev/react-lang': 1.0.1
  '@tailwindcss/postcss': 4.3.3
  '@tailwindcss/vite': 4.3.3
  '@types/node': 24.19.2
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  '@vitejs/plugin-basic-ssl': 2.3.0
  '@vitejs/plugin-react': 6.1.2
  '@vitest/browser': 5.0.5
  '@vitest/browser-playwright': 5.0.5
  '@vitest/browser-preview': 5.0.5
  '@vitest/coverage-v8': 5.0.5
  '@vitest/expect': 5.0.5
  '@vitest/mocker': 5.0.5
  '@vitest/pretty-format': 5.0.5
  '@vitest/snapshot': 5.0.5
  '@vitest/spy': 5.0.5
  '@vitest/ui': 5.0.5
  '@vitest/utils': 5.0.5
  # @k8ordo/ui/ai-sdk の peer。example が使う @ai-sdk/react は ai を exact で
  # 持つので、上げるときは同じ ai を持つ @ai-sdk/react と揃えて 1 コピーに保つ。
  ai: 7.0.143
  # @k8ordo/framework の reactCompiler が使う、@vitejs/plugin-react の任意の peer。
  # 版は plugin-react の peer の範囲から選ぶので、plugin-react と揃えて手で上げる (renovate.json)
  oxc-transform-react: 0.152.0
  # 1.64 は Firefox が iframe をまたぐフォーカスを壊すので飛ばす (renovate.json)
  playwright: 1.63.0
  postcss: 8.5.30
  publint: 0.3.25
  react: 19.3.1
  react-dom: 19.3.1
  server-only: 0.0.1
  tailwindcss: 4.3.3
  typescript: 7.0.2
  # vite-plus 0.3.1 以降の `vp pack` / `vp dev` は、実行するパッケージが vite を
  # 宣言していると、それが同じ版の @voidzero-dev/vite-plus-core でなければ落ちる。
  # 本家 vite ではなく core の別名を置き、版は vite-plus と常に揃える。
  # 宣言を消して vite-plus 任せにしないのは、消すと plugin-react や vitest の
  # peer に pnpm が本家 vite を自動で入れ、vitest の実体が割れて
  # expect.element の型が消えるため。
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vite-plus: 1.3.0
  vitest: 5.0.5
  vitest-browser-react: 2.3.0
  zod: 4.6.5

minimumReleaseAge: 10080

# vite (rolldown 経由) と vite-plus はそれぞれ @oxc-project/types を exact pin しており、
# 両者の pin がずれると同一内容の型が 2 コピーになり、vite の Plugin 型の比較で
# tsc が "Excessive stack depth" を起こして typecheck が落ちる。単一バージョンに
# 強制して型グラフのコピーを 1 つに保つ (types のみのパッケージでランタイム影響なし)。
overrides:
  '@oxc-project/types': 0.154.0

  # vitest は vite-plus が exact pin (1.0.0 は 5.0.1) で連れてくる依存で、
  # `vp test` が起動するのは常に vite-plus 側の 1 本。catalog の vitest が
  # その pin とずれると、そこへ catalog 版の @vitest/browser-playwright が刺さり、
  # ブラウザモードが `_parentBrowser.spawn is not a function` で落ちる
  # (0.3.x の vitest 4 に 5 を刺したときに起きた)。
  # 木全体を catalog の 1 バージョンに寄せて、vitest のコピーを 1 つに保つ。
  # 版は書かず catalog を指す。overrides に数字を置くと catalog だけが更新された
  # ときに overrides が黙って巻き戻す pin になり、上げたつもりで上がらない。
  # @vitest/runner は v5 で vitest 本体に取り込まれ公開が止まったので 5 系が無い。
  # vite-plus は再エクスポートのため (dist/test/plugins/runner.js、32 バイト) に
  # 参照しているだけで実行時には読まれないため、4.1.11 のまま残す。
  vitest: 'catalog:'
  '@vitest/browser': 'catalog:'
  '@vitest/browser-playwright': 'catalog:'
  '@vitest/browser-preview': 'catalog:'
  '@vitest/coverage-v8': 'catalog:'
  '@vitest/expect': 'catalog:'
  '@vitest/mocker': 'catalog:'
  '@vitest/pretty-format': 'catalog:'
  '@vitest/snapshot': 'catalog:'
  '@vitest/spy': 'catalog:'
  '@vitest/ui': 'catalog:'
  '@vitest/utils': 'catalog:'

# catalog の vite は vite-plus-core の別名なので、版は vite-plus のもの (1.x) に
# なり、vite を peer に持つパッケージ (vitest・plugin-react・@k8ordo/framework など)
# の範囲をどれも満たさない。中身は vite-plus が同梱する vite で、別名の版で互換を
# 確かめても意味がないため、vite の peer だけ版を問わない (Vite+ の移行ツールが
# 書くのと同じ設定)。
peerDependencyRules:
  allowAny:
    - vite
  # storybook (10.6.2 時点の最新でも) の vite-plus の peer は ^0.1.15 || ^0.2.0 のまま。
  # ここの Storybook (VRT・Chromatic) は 1.3 で動いているので 1.3 だけ足す。
  # vite-plus を上げて警告が戻ったら、その版で Storybook が動くか確かめてから広げる。
  allowedVersions:
    storybook>vite-plus: '1.3'

minimumReleaseAgeExclude:
  - '@better-css-modules/*'
  - '@k8o/*'
  - 'storybook-addon-determinism'
  - 'storybook-addon-vrt'
  - 'vite-plus-inspector'
  # Renovate security update: next@16.3.8 || 16.4.1
  - next@16.3.8 || 16.4.1
  # better-css-modules 0.4.1 の security update が exact pin する版
  - postcss@8.5.31
  # Renovate security update: vitest@5.0.5 と、それを exact pin する vite-plus@1.3.0。
  # 名前のパターンには版を付けられないので 1 つずつ並べる
  - vitest@5.0.5
  - '@vitest/browser@5.0.5'
  - '@vitest/browser-playwright@5.0.5'
  - '@vitest/browser-preview@5.0.5'
  - '@vitest/coverage-v8@5.0.5'
  - '@vitest/expect@5.0.5'
  - '@vitest/mocker@5.0.5'
  - '@vitest/pretty-format@5.0.5'
  - '@vitest/snapshot@5.0.5'
  - '@vitest/spy@5.0.5'
  - '@vitest/ui@5.0.5'
  - '@vitest/utils@5.0.5'
  - vite-plus@1.3.0
  - '@voidzero-dev/vite-plus-core@1.3.0'
  - '@voidzero-dev/vite-plus-darwin-arm64@1.3.0'
  - '@voidzero-dev/vite-plus-darwin-x64@1.3.0'
  - '@voidzero-dev/vite-plus-linux-arm64-gnu@1.3.0'
  - '@voidzero-dev/vite-plus-linux-arm64-musl@1.3.0'
  - '@voidzero-dev/vite-plus-linux-x64-gnu@1.3.0'
  - '@voidzero-dev/vite-plus-linux-x64-musl@1.3.0'
  - '@voidzero-dev/vite-plus-win32-arm64-msvc@1.3.0'
  - '@voidzero-dev/vite-plus-win32-x64-msvc@1.3.0'

verifyDepsBeforeRun: install

versioning:
  # ui だけ外すのは、npm に 1.0.0 と 2.0.0 があるため。fixed はグループの最高版に
  # 最大の bump を足すので、ui を入れると全部が 3.0.0 になる。
  fixed:
    - - '@k8ordo/color-scheme'
      - '@k8ordo/form'
      - '@k8ordo/framework'
      - '@k8ordo/i18n'
      - '@k8ordo/router'
      - '@k8ordo/state'
  changelog:
    storage: repository
